# nginx in front of the Conform service (TLS + reverse proxy). Replace conform.your-domain.tld and
# get a certificate (for example: certbot --nginx -d conform.your-domain.tld).
server {
    listen 80;
    listen [::]:80;
    server_name conform.your-domain.tld;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name conform.your-domain.tld;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/conform.your-domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conform.your-domain.tld/privkey.pem;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
